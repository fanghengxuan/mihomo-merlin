<script>
(function(){
  var d=document.documentElement;
  function rd(k){try{return localStorage.getItem(k)}catch(e){return null}}
  var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  var pref=rd('mm-theme')||'system';
  var dark=mq?mq.matches:true;
  if(pref!=='light'&&pref!=='dark')pref=dark?'dark':'light';
  d.setAttribute('data-theme',pref);
  var accent=rd('mm-accent')||'blue';
  if(!/^(blue|violet|teal|green|orange|rose)$/.test(accent))accent='blue';
  d.setAttribute('data-accent',accent);
  d.setAttribute('data-mono',rd('mm-mono')==='1'?'1':'0');
  var le=rd('mm-lowend')||'auto';
  var low=le==='on'||(le==='auto'&&((navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory&&navigator.deviceMemory<=4)||(mq&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)));
  d.setAttribute('data-low-end',low?'1':'0');
  d.style.colorScheme=pref;
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',d.getAttribute('data-mono')==='1'&&pref==='dark'?'#000000':(pref==='dark'?'#0F1013':'#EDEEF1'));
})();
</script>

<div class="shell">
  <aside class="rail" id="rail" aria-label="主导航">
    <div class="rail-brand" title="Mihomo 魔方"><svg class="brand-mark"><use href="#i-brand"/></svg></div>
    <nav class="rail-nav" id="railNav">
      <button class="rail-item" data-route="/overview" aria-label="概览"><svg><use href="#i-overview"/></svg><em>概览</em></button>
      <button class="rail-item" data-route="/nodes" aria-label="节点"><svg><use href="#i-nodes"/></svg><em>节点</em></button>
      <button class="rail-item" data-route="/subs" aria-label="订阅"><svg><use href="#i-subs"/></svg><em>订阅</em></button>
      <button class="rail-item" data-route="/rules" aria-label="规则"><svg><use href="#i-rules"/></svg><em>规则</em></button>
      <button class="rail-item" data-route="/connections" aria-label="连接"><svg><use href="#i-conn"/></svg><em>连接</em></button>
      <button class="rail-item" data-route="/logs" aria-label="日志"><svg><use href="#i-logs"/></svg><em>日志</em></button>
      <button class="rail-item" data-route="/settings" aria-label="设置"><svg><use href="#i-settings"/></svg><em>设置</em></button>
    </nav>
    <button class="rail-foot" id="railFoot" title="回到概览">
      <span class="dot" id="railDot"></span>
      <span class="rail-state" id="railState">未运行</span>
      <span class="rail-ver" id="railVersion">v2.0.1</span>
    </button>
  </aside>

  <main class="app-main">
    <header class="appbar" id="appbar">
      <button class="icon-btn back-btn" id="btnBack" aria-label="返回" title="返回"><svg><use href="#i-back"/></svg></button>
      <h1 id="pageTitle">概览</h1>
      <div class="appbar-actions" id="appbarActions"></div>
      <button class="icon-btn more-btn" id="btnMore" aria-label="更多" title="更多"><svg><use href="#i-more"/></svg></button>
    </header>
    <div class="content" id="viewRoot"></div>
  </main>

  <nav class="dock" id="dock" aria-label="底部导航">
    <button class="dock-item" data-route="/overview" aria-label="概览"><svg><use href="#i-overview"/></svg><em>概览</em></button>
    <button class="dock-item" data-route="/nodes" aria-label="节点"><svg><use href="#i-nodes"/></svg><em>节点</em></button>
    <button class="dock-item" data-route="/subs" aria-label="订阅"><svg><use href="#i-subs"/></svg><em>订阅</em></button>
    <button class="dock-item" data-route="/connections" aria-label="连接"><svg><use href="#i-conn"/></svg><em>连接</em></button>
    <button class="dock-item" data-route="/settings" aria-label="设置"><svg><use href="#i-settings"/></svg><em>设置</em></button>
  </nav>
</div>
